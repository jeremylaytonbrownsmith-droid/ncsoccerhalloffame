<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/gif" href="https://static.wixstatic.com/media/b61df5_2d78aa055ed941998b13bb85c7b266a7~mv2.gif">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | NC Soccer Hall of Fame</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0a1628;--deep:#0d1f3c;--gold:#c5a55a;--gold-l:#e0cc8a;--gold-d:#a68b3c;--cream:#f6f1e7;--white:#fff;--g200:#e8e4db;--g600:#6b6860}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--cream);color:var(--navy);-webkit-font-smoothing:antialiased}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes goldLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.nf{background:linear-gradient(160deg,var(--navy) 0%,var(--deep) 60%,#132f52 100%);min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3.5rem 1.2rem;position:relative;overflow:hidden}
.nf-grid{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(197,165,90,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(197,165,90,.04) 1px,transparent 1px);background-size:52px 52px}
.nf-ring{position:absolute;border-radius:50%;pointer-events:none;border:1px solid rgba(197,165,90,.06);z-index:0}
.nf-ring-1{width:600px;height:600px;top:-280px;right:-160px}
.nf-ring-2{width:340px;height:340px;bottom:-180px;left:-90px;border-color:rgba(255,255,255,.03)}
.nf-logo{width:74px;height:74px;object-fit:contain;border-radius:50%;margin-bottom:1.2rem;position:relative;z-index:1;filter:drop-shadow(0 4px 16px rgba(0,0,0,.45));animation:fadeUp .5s ease both}
.nf-code{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(3.2rem,12vw,6rem);line-height:1;color:var(--gold);letter-spacing:.04em;position:relative;z-index:1;animation:fadeUp .6s ease both}
.nf h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(1.1rem,3.4vw,1.7rem);text-transform:uppercase;letter-spacing:.08em;color:var(--white);margin-top:.6rem;position:relative;z-index:1;animation:fadeUp .6s ease .1s both}
.nf p{font-family:'Crimson Pro',serif;font-style:italic;font-weight:300;color:rgba(255,255,255,.55);margin-top:.7rem;font-size:clamp(.9rem,2.4vw,1.05rem);max-width:480px;line-height:1.6;position:relative;z-index:1;animation:fadeUp .6s ease .15s both}
.nf-line{width:60px;height:2px;background:var(--gold);margin:1.2rem auto;animation:goldLine .8s ease .25s both;transform-origin:center;position:relative;z-index:1}
.nf-links{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:.6rem;position:relative;z-index:1;animation:fadeUp .6s ease .2s both}
.nf-btn{font-family:'Oswald',sans-serif;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;padding:.7rem 1.4rem;border-radius:6px;transition:transform .2s,box-shadow .2s,background .2s,color .2s}
.nf-btn.primary{color:var(--navy);background:linear-gradient(135deg,var(--gold),var(--gold-d));box-shadow:0 3px 12px rgba(197,165,90,.3)}
.nf-btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(197,165,90,.4)}
.nf-btn.ghost{color:var(--white);border:1px solid rgba(255,255,255,.25)}
.nf-btn.ghost:hover{border-color:var(--gold);color:var(--gold-l)}
</style>
</head>
<body data-page="404">

<section class="nf">
  <div class="nf-grid"></div>
  <div class="nf-ring nf-ring-1"></div>
  <div class="nf-ring nf-ring-2"></div>
  <img class="nf-logo" src="https://static.wixstatic.com/media/b61df5_91e6ffbf67a14644b612d7ea3293baaa~mv2.png" alt="NC Soccer Hall of Fame logo">
  <div class="nf-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for may have moved or no longer exists. Let's get you back on track.</p>
  <div class="nf-line"></div>
  <div class="nf-links">
    <a class="nf-btn primary" href="/">Return Home</a>
    <a class="nf-btn ghost" href="/inductees/">Inductees</a>
    <a class="nf-btn ghost" href="/champions/">National Champions</a>
    <a class="nf-btn ghost" href="/contact/">Contact Us</a>
  </div>
</section>

<script src="/js/site.js"></script>
</body>
</html>
