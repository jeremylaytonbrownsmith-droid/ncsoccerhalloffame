<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCSHOF Pictures | NC Soccer Hall of Fame</title>
  <meta name="description" content="Photos from North Carolina Soccer Hall of Fame induction ceremonies and events.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .photo-grid .placeholder {
      aspect-ratio: 4 / 3;
      background: #f1f1f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>
<body data-page="pictures" data-root="../">

  <main class="page">
    <h1>NCSHOF Pictures</h1>
    <p class="lead">Moments from induction ceremonies and Hall of Fame events.</p>

    <div class="photo-grid">
      <div class="placeholder">Add photo</div>
      <div class="placeholder">Add photo</div>
      <div class="placeholder">Add photo</div>
      <div class="placeholder">Add photo</div>
      <div class="placeholder">Add photo</div>
      <div class="placeholder">Add photo</div>
      <div class="placeholder">Add photo</div>
      <div class="placeholder">Add photo</div>
    </div>

    <p style="margin-top:30px;color:#888;font-size:14px;">
      <em>Note: Drop the event photos into the <code>assets/</code> folder and I'll wire them into this gallery (with a lightbox if you'd like).</em>
    </p>
  </main>

  <script src="../js/site.js"></script>
</body>
</html>
